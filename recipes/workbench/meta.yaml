{% set name = "connectome-workbench" %}
{% set version = "2.0.1" %}
{% set ref = "3e0ef7f8cde14f9b70add4aab14c0a355aa87487" %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  url: https://github.com/Dhananjhay/workbench/archive/{{ ref }}.tar.gz
  sha256: 1d92ba9ccd35558e42a376319f5b1dc9f020f9b0a7aa0491d931298856461ea3

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('cxx') }}
    # - {{ stdlib('c') }}
    - cmake >=3.0  # [linux]
    - cmake >=3.5  # [osx]
    - ninja
    - qwt
    # OpenMP
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
    # libGL
    - {{ cdt('mesa-libgl-devel') }}  # [linux]
    - {{ cdt('mesa-dri-drivers') }}  # [linux]
    - {{ cdt('libxdamage') }}        # [linux]
    - {{ cdt('libxxf86vm') }}        # [linux]
    - {{ cdt('libxext') }}           # [linux]
  host:
    - qt
    - openssl
    # 1.2 is ABI compatible with 1.3, so this provides more flexibility
    - libzlib =1.2
    - zlib
    - freetype
    - libglu                         # [linux]
    - glew                           # [windows]

test:
  commands:
    - wb_command -version
    - wb_shortcuts -help

outputs:
  - name: {{ name }}-cli
    # build/host requirements should exactly match the root requirements
    requirements:
      build:
        - {{ compiler('cxx') }}
        # - {{ stdlib('c') }}
        - cmake >=3.0
        - ninja
        - qwt
        # OpenMP
        - llvm-openmp  # [osx]
        - libgomp      # [linux]
        # libGL
        - {{ cdt('mesa-libgl-devel') }}  # [linux]
        - {{ cdt('mesa-dri-drivers') }}  # [linux]
        - {{ cdt('libxdamage') }}        # [linux]
        - {{ cdt('libxxf86vm') }}        # [linux]
        - {{ cdt('libxext') }}           # [linux]
      host:
        - qt
        - openssl
        - libzlib =1.2
        - zlib
        - freetype
        - libglu                         # [linux]
        - glew                           # [windows]
      run:
        - qt-main
        - libgl                             # [linux]
        - libglu                            # [linux]
    files:
      include:
        - bin/wb_command
        - bin/wb_shortcuts
        - share/bash-completion/completions/*
    test:
      commands:
        - wb_command -version
        - wb_shortcuts -help
  - name: {{ name }}
    requirements:
      run:
        - {{ pin_subpackage('connectome-workbench-cli', exact=True) }}
    test:
      commands:
        - wb_command -version
        - wb_shortcuts -help

about:
  home: https://www.humanconnectome.org/software/connectome-workbench
  summary: 'Neuroimaging utility for the Human Connectome Project'
  description: |
    Connectome Workbench is an open source, freely available visualization and discovery
    tool used to map neuroimaging data, especially data generated by the Human
    Connectome Project.
  license: GPL-2.0-only
  license_family: GPL
  license_file:
    - LICENSE
    - src/CZIlib/LICENSE
    - src/QxtCore/LICENSE_qxt
    - src/kloewe/cpuinfo/LICENSE
    - src/kloewe/dot/LICENSE
  doc_url: https://humanconnectome.org/software/workbench-command
  dev_url: https://github.com/Washington-University/workbench

extra:
  recipe-maintainers:
    - Dhananjhay
