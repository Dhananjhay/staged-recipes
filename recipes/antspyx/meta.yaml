{% set name = "antspyx" %}
{% set version = "0.5.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/antspyx-{{ version }}.tar.gz
  sha256: 68e3e6ece5e19f6fae0eb4d6f9f1a3e40851cef2629dd49abd7bf71d4ba15cae

build:
  skip: true  # [py<38 or win]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - cmake
    - {{ compiler('cxx') }}
    - make
    - zlib
  host:
    - python
    - scikit-build-core >=0.4.3
    - nanobind >=1.3.2
    - pip
    - libpng
  run:
    - python
    - pandas
    - pyyaml
    - numpy <=2.0.1
    - statsmodels
    - webcolors
    - matplotlib-base
    - pillow
    - requests

test:
  imports:
    - ants
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/ANTsX/ANTsPy
  summary: A fast medical imaging analysis library in Python with algorithms for registration, segmentation, and more.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Dhananjhay
