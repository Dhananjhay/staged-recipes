name: Build & Publish antspyx

on:
  push:
    branches:
      - djay/add-antspyx

jobs:
  build:
    runs-on: macOS-13
    env:
      # pick up your Anaconda API token for non-interactive upload
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
      # target platform for build
      CONDA_SUBDIR: osx-64

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Cache conda-bld
        uses: actions/cache@v3
        with:
          path: ~/miniforge3/conda-bld
          key: ${{ runner.os }}-conda-bld-${{ hashFiles('recipes/meta.yaml') }}
          restore-keys: ${{ runner.os }}-conda-bld-

      - name: Setup Miniforge + mamba + boa
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          mamba-version: "*"
          use-mamba: true
          conda-solver: libmamba
          auto-activate-base: true

      - name: Install build tools
        run: |
          mamba install -y -c conda-forge boa anaconda-client jq

      - name: Build & capture path
        id: build
        working-directory: recipes
        run: |
          set -eux

          # 1) build once, skip tests, and emit JSON
          boa build . \
            -c conda-forge \
            --no-test \
            --json > build.json

          # 2) peek at the JSON so we know it succeeded
          cat build.json

          # 3) extract the tar.bz2 path
          pkg=$(jq -r '.[0].output_file' build.json)
          echo "::debug::artifact is at $pkg"

          # 4) export to the next step
          echo "PACKAGE_PATH=$pkg" >> $GITHUB_ENV

      - name: Upload to khanlab
        run: |
          # anaconda-client will read $ANACONDA_TOKEN automatically
          anaconda upload "$PACKAGE_PATH" \
            --user khanlab \
            --channel main \
            --force \
            --quiet
