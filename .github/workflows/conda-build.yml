name: Build and Upload Conda Package

on:
  push:
    branches:
      - main  # or the branch you want to trigger the CI on

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          conda-version: "latest"
          auto-activate-base: false

      - name: Install dependencies
        run: |
          conda install -y conda-build anaconda-client

      - name: Build the package for osx-64
        run: |
          CONDA_SUBDIR=osx-64 conda-build recipes/antspyx 

      - name: Upload package to Khanlabn channel
        run: |
          anaconda login --username ${{ secrets.ANACONDA_USERNAME }} --password ${{ secrets.ANACONDA_PASSWORD }}
          # anaconda upload /path/to/conda-package.tar.bz2 --yes
